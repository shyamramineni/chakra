var Quotation = Backbone.Model.extend({
	defaults: {
		"cageLength":0,
		"noOfCuttings":0,
		"noOfSheds":0,
		"fulls":0,
		"halfs":0,
		"tiers":0,
		"customerId":null,
		"enquiryId":null
	},
	initialize: function() {
		this.customer = null;
		this.taxId = null;
		this.quotationRelatedInfo = null;
		this.modelGrid = new ModelGrid({"context":this});
		console.log("Model: Quotation Initialized");
	},
	submitSpecs:function(url) {
		console.log(this.toJSON());
		var data = JSON.stringify(this.toJSON());
		var req="requestData="+data+"&requestType=QuotationSubmitRequest";
		var comm = new Communicator;
		comm.sendRequest(req, url, this.submitSpecsCallback, this);
	},
	submitSpecsCallback: function(status, data, jqXHR) {
		if(status == "Success")
		{
			var context = this.specsCallbackContext;
			var resp = $.parseJSON(jqXHR.responseText);
			this.quotationRelatedInfo = new QuotationRelatedInformation(resp.responseData.quotInfo);
			this.set({"id": resp.id});
			this.specsSubmitCallbackFunction.call(context, this.quotationRelatedInfo);
		}
	},
	addModel: function(model) {
		var context = this.modelCallbackContext;
		this.modelGrid.addModel(model);
		console.log("addModel");
		console.log(this.modelGrid);
		this.modelAddCallbackFunction.call(context, model);
	},
	registerModelAddCallback: function(func, context) {
		this.modelCallbackContext=context; 
		this.modelAddCallbackFunction = func;
	},
	registerSpecsSubmitCallback: function(func, context) {
		this.specsCallbackContext=context; 
		this.specsSubmitCallbackFunction = func;
	},
	afterSpecsSubmit: function() {
		this.modelGridView = new ModelGridView({el: "#models_tile"});
		this.modelGridView.quotation = this;
	}
});

var Communicator = Backbone.Model.extend({
	channel : new Array(),
	defaults: {
		"requestData" : null,
		"requestUrl" : null,
		"responseCallback" : null,
		"channel": "1",
		"state" : "Idle"
	},
	initialize: function() {
		this.on("change:channel", function(eventName) {
			if(!this.channel[this.get('channel')])
				this.channel[this.get('channel')] = {state: "Idle", callbacks: []};
			else
			{
				this.set({"state": this.channel[this.get('channel')].state});
			}
		});
		this.on("change:state", function(eventName) {
			this.channel[this.get('channel')].state = this.get('state');
			for(var func in this.channel[this.get('channel')].callbacks)
			{
				this.channel[this.get('channel')].callbacks[func](this);
			}
		});
		this.trigger("change:channel");
		console.log("Model: Communicator Initialized!");
	},
	sendRequest: function(req, url, respCallback, context) {
		console.log(req);
		this.set({"state": this.channel[this.get('channel')].state},{silent:true});
		if(this.get("state") == "Idle")
		{
			this.set({ state : "Working" });
			this.set({ requestData : req });
			this.set({ requestUrl : url });
			this.set({ responseCallback : respCallback });
			this.set({callbackContext: context});
			$.ajax({
				type: 'POST',
				url: this.get('requestUrl'),
				context: this,
				contentType:"application/x-www-form-urlencoded",
				data: this.get('requestData'),
				success: this.successCallback,
				error: this.errorCallback,
				async: true
			});
		}
		else
			return null;
	},
	successCallback: function(data, textStatus, jqXHR) {
		console.log("response: "+jqXHR.responseText);
		var context = this.get('callbackContext');
		this.get('responseCallback').call(context,"Success", data, jqXHR);
		this.set({ state : "Idle" });
	},
	errorCallback: function(jqXHR, textStatus, errorThrown) {
		//console.log(textStatus);
		this.get('responseCallback')("Fail", errorThrown, jqXHR);
		this.set({ state : "Idle" });
	}
});

var CustomerView = Backbone.View.extend({
	initialId: "#customer_tile_content-initial",
	finalId: "#customer_tile_content-final",
	currentId: null,
	defaults: {
		"state":"initial"
	},
	events: {
		"click #search-btn":"doSearch",
		"click #add-btn":"doAdd",
		"click #addwithaddl-btn":"showExtraFields",
		"click input[type=radio]":"selectCustomer"
	},
	showExtraFields: function(e) {
		this.$("[name=extra]").css({"display":"table-row"});
		this.$("#addwithaddl-btn").css({display:"none"});
	},
	selectCustomer: function(e) {
		var id = $(e.currentTarget).attr("name");
		console.log(id);
		this.currentId = this.finalId;
		var params = this.customerResults.get(id);
		console.log(params);
		this.renderFinal(params.toJSON());
	},
	serialize: function() {
		return {
			"custname": this.$("#custname-input").val(),
			"mobile": this.$("#mobile-input").val(),
			"compname": this.$("#companyname-input").val(),
			"address": this.$("#address-input").val(),
			"email": this.$("#email-input").val(),
			"phone": this.$("#phoneno-input").val(),
			"fax": this.$("#fax-input").val(),
			"comments": this.$("#comments-input").val(),
		};
	},
	render: function() {
		var template = _.template($(this.currentId).html(), {});
		this.$el.html(template);
		this.setShadowFunction("#companyname-input","Company Name");
		this.setShadowFunction("#custname-input","Customer Name");
		this.setShadowFunction("#mobile-input","Mobile No");
		this.setShadowFunction("#address-input","Address");
		this.setShadowFunction("#email-input","Email ID");
		this.setShadowFunction("#phoneno-input","Phone Number");
		this.setShadowFunction("#fax-input","Fax");
		this.setShadowFunction("#comments-input","Comments");
	},
	renderFinal: function(params) {
		var template = _.template($(this.currentId).html(), params);
		this.$el.html("");
		this.$el.html(template);
	},
	setShadowFunction: function(id, shadowText) {
		$(id).val(shadowText).bind("focusin",this,function(e) {
			var context = e.data;
			if(!context.flagData[id])
				$(id).val("").removeClass("textfield-initial");
		});
		$(id).focusout(this, function(e) {
			var context = e.data;
			if($(id).val() == "")
			{
				$(id).val(shadowText).addClass("textfield-initial");
				context.flagData[id] = false;
			}
			else
				context.flagData[id] = true;
		});
	},
	initialize: function() {
		this.currentId = this.initialId;
		this.flagData = new Array();
		this.render();
	},
	doSearch: function(e) {
		this.customerRequest = new CustomerRequest({url:"/Quotation_Page/ajax.php"});
		this.customerRequest.registerCallback(this.doSearchCallback, this);
		var model = new Customer(this.serialize());
		this.customerRequest.searchCustomer(model.toJSON());		
	},
	doSearchCallback: function(results) {
		console.log("results:");
		console.log(results);
		this.customerResults = results;
		results.each(function (element, index, list) {
			var temp = _.template($("#customer_search_result_entry").html(), element.toJSON());
			this.$(".customer-content-container-results-area table").append($(temp));
		});
		this.undelegateEvents();
		this.delegateEvents();
	},
	doAdd: function(e) {
		this.customerRequest = new CustomerRequest({url:"/Quotation_Page/ajax.php"});
		this.customerRequest.registerCallback(this.doAddCallback, this);
		var model = new Customer(this.serialize());
		this.customerRequest.addCustomer(model.toJSON());
	},
	doAddCallback: function(result) {
		this.customerResults = result;
		var id = result.at(0).get('id');
		console.log(id);
		this.currentId = this.finalId;
		var params = this.customerResults.get(id);
		console.log(params);
		this.renderFinal(params.toJSON());
	}
});

var SpecsView = Backbone.View.extend({
	initialId: "#specs_tile_content-initial",
	finalId: "#specs_tile_content-final",
	infoId: "#quotation_info_tile_content",
	currentId: null,
	defaults: {
		"state":"initial"
	},
	events: {
		"click #quotation_specs_submit-btn":"doSubmit"
	},
	serialize: function() {
		return {
			"cageLength": this.$("#cage_length").val(),
			"noOfCuttings": this.$("#cage_cuttings").val(),
			"noOfSheds": this.$("#shed_count").val(),
			"fulls": this.$("#fulls_count").val(),
			"halfs": this.$("#halfs_count").val(),
			"tiers": this.$("#tiers_count").val()
		};
	},
	setQuotation: function(q) {
		this.quotation = q;
	},
	doSubmit: function(e) {
		this.quotation.set(this.serialize());
		this.quotation.registerSpecsSubmitCallback(this.doSubmitCallback, this);
		this.quotation.submitSpecs("/Quotation_Page/ajax.php");
	},
	doSubmitCallback: function(quotInfo) {
		this.quotInfo = quotInfo;
		console.log(this.quotation.toJSON());
		this.renderFinal(this.quotation.toJSON());
		this.setElement("#quotation_info_tile");
		this.renderInfo(this.quotInfo.toJSON());
		this.quotation.afterSpecsSubmit();
	},
	initialize: function() {
		//this.render();
		console.log("View: SpecsView initialized!");
	},
	render: function() {
		var temp = _.template($(this.initialId).html(),{});
		this.$el.html(temp);
	},
	renderFinal: function(params) {
		var temp = _.template($(this.finalId).html(),params);
		this.$el.html(temp);
	},
	renderInfo: function(params) {
		var temp = _.template($(this.infoId).html(),params);
		this.$el.html(temp);
	}
});

$(function() {
	var customerView = new CustomerView({el: "#customer_tile"});
	var quotation = new Quotation();
	var specsView = new SpecsView({el: "#quotation_info_tile_init"});
	specsView.setQuotation(quotation);
	specsView.render();
});
